<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>你此刻像哪个少年古人</title>
<style>
  /* 基础重置与全局样式 */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    font-size: 16px; /* 基础字号 16px */
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f6f4ef; /* 浅色纯色背景 */
    color: #2b2b2b; /* 深色文字 */
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }

  /* 移动端优先：内容容器最大宽度 640px 居中 */
  .app {
    width: 100%;
    max-width: 640px;
    min-height: 100vh;
    padding: 24px 20px 32px;
    display: flex;
    flex-direction: column;
  }

  /* 屏幕切换控制 */
  .screen {
    display: none;
    flex: 1;
    flex-direction: column;
  }
  .screen.active {
    display: flex;
  }

  /* 首屏 */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 24px 0;
  }
  .hero h1 {
    font-size: 2rem;
    line-height: 1.3;
    letter-spacing: 0.02em;
    margin-bottom: 12px;
  }
  .hero .subtitle {
    font-size: 1rem;
    color: #6b6b6b;
    margin-bottom: 32px;
  }
  .pay-hint {
    /* 首屏必须清晰可见的付费提示，不藏在按钮后 */
    font-size: 0.875rem;
    color: #8a6d3b;
    background: #fbf5e6;
    border: 1px solid #e8dcc0;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 32px;
    line-height: 1.6;
  }

  /* 按钮通用 */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px; /* 触控区域不小于 44px */
    padding: 12px 28px;
    font-size: 1rem;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  .btn:active {
    transform: scale(0.98);
  }
  .btn-primary {
    background: #3a3a3a;
    color: #ffffff;
    width: 100%;
    max-width: 320px;
  }
  .btn-ghost {
    background: transparent;
    color: #6b6b6b;
    border: 1px solid #d8d3c8;
    width: 100%;
    max-width: 320px;
  }

  /* 题目区域 */
  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    min-height: 44px;
  }
  .back-btn {
    min-height: 44px;
    min-width: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: #6b6b6b;
    font-size: 0.9375rem;
    cursor: pointer;
    border-radius: 8px;
  }
  .back-btn:disabled {
    opacity: 0;
    pointer-events: none;
  }
  .progress {
    font-size: 0.8125rem;
    color: #9a9a9a;
    letter-spacing: 0.05em;
  }

  .question-text {
    font-size: 1.375rem;
    line-height: 1.5;
    font-weight: 600;
    margin-bottom: 28px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 28px;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    min-height: 56px; /* 触控区域不小于 44px */
    padding: 14px 16px;
    font-size: 1rem;
    line-height: 1.5;
    background: #ffffff;
    color: #2b2b2b;
    border: 1.5px solid #e2ddd1;
    border-radius: 12px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option .mark {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.875rem;
    font-weight: 600;
    background: #f0ede6;
    border-radius: 50%;
    color: #6b6b6b;
  }
  .option.selected {
    border-color: #3a3a3a;
    background: #f3f1ea;
  }
  .option.selected .mark {
    background: #3a3a3a;
    color: #ffffff;
  }

  .result-action {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 结果页 */
  .result {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 16px 0;
  }
  .result-badge {
    font-size: 0.8125rem;
    letter-spacing: 0.2em;
    color: #8a6d3b;
    margin-bottom: 18px;
  }
  .result-title {
    font-size: 1.5rem;
    line-height: 1.5;
    font-weight: 700;
    margin-bottom: 24px;
  }
  .result-experience {
    font-size: 0.9375rem;
    line-height: 1.9;
    color: #4a4a4a;
    text-align: left;
    background: #ffffff;
    border-left: 3px solid #e0d8c6;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 18px;
  }
  .result-comfort {
    font-size: 0.9375rem;
    line-height: 1.9;
    color: #3c3c3c;
    text-align: left;
    margin-bottom: 24px;
  }
  .result-closer {
    font-size: 0.875rem; /* 稍小字号 */
    color: #6b6b6b;
    margin-bottom: 40px;
  }
  .result-bottom {
    margin-top: auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .disclaimer {
    font-size: 0.6875rem; /* 最小字号 */
    color: #a5a5a5;
    line-height: 1.5;
    max-width: 320px;
  }
</style>
</head>
<body>
<div class="app">

  <!-- 首屏 -->
  <section id="screen-start" class="screen active">
    <div class="hero">
      <h1>你此刻像哪个少年古人</h1>
      <p class="subtitle">12 道题，约 1 分钟</p>
      <!-- 付费提示：首屏清晰可见，不藏在按钮后 -->
      <p class="pay-hint">本测试结果需支付 0.99 元解锁。付款后自动获得测试链接。</p>
      <button id="btn-start" class="btn btn-primary" type="button">开始测试</button>
    </div>
  </section>

  <!-- 答题屏 -->
  <section id="screen-quiz" class="screen">
    <div class="quiz-header">
      <button id="btn-back" class="back-btn" type="button" aria-label="返回上一题">← 上一题</button>
      <span id="progress" class="progress">1 / 12</span>
    </div>
    <h2 id="question-text" class="question-text"></h2>
    <div id="options" class="options"></div>
    <div id="result-action" class="result-action" hidden>
      <button id="btn-result" class="btn btn-primary" type="button">查看结果</button>
    </div>
  </section>

  <!-- 结果屏 -->
  <section id="screen-result" class="screen">
    <div class="result">
      <div class="result-badge">人物 · 时刻 · 情绪坐标</div>
      <h2 id="result-title" class="result-title"></h2>
      <p id="result-experience" class="result-experience"></p>
      <p id="result-comfort" class="result-comfort"></p>
      <p class="result-closer">你最近咽下去的那句话是什么？</p>
      <div class="result-bottom">
        <button id="btn-retry" class="btn btn-ghost" type="button">再测一次</button>
        <p class="disclaimer">本测试为情绪趣味探索，不构成心理诊断或医疗建议。</p>
      </div>
    </div>
  </section>

</div>

<script>
  // 12 道题，每题三个选项，A=2 分、B=1 分、C=0 分。
  // dim 字段表示该题所属维度（0~5），与 results 数组下标对应。
  const questions = [
    // 维度 0：隐忍蓄力
    {
      dim: 0,
      text: '最近一次你咽下一句话没说出来，是因为什么？',
      options: [
        { key: 'A', label: '怕说出来后果更糟', score: 2 },
        { key: 'B', label: '觉得说了也没用', score: 1 },
        { key: 'C', label: '你一般不会咽，当场就说了', score: 0 }
      ]
    },
    {
      dim: 0,
      text: '当你被人故意忽视时，你更可能：',
      options: [
        { key: 'A', label: '不抬头，把情绪收起来', score: 2 },
        { key: 'B', label: '表面没事，心里记着', score: 1 },
        { key: 'C', label: '直接问对方什么意思', score: 0 }
      ]
    },
    // 维度 1：愤怒未发
    {
      dim: 1,
      text: '你心里那团火最近一次烧起来，是因为什么？',
      options: [
        { key: 'A', label: '被人当众否定，但你忍住了', score: 2 },
        { key: 'B', label: '一件小事反复被踩，你还没发作', score: 1 },
        { key: 'C', label: '你很少压火，一般当场就发', score: 0 }
      ]
    },
    {
      dim: 1,
      text: '如果愤怒有形状，你此刻的更像：',
      options: [
        { key: 'A', label: '烧到一半被你按住的火', score: 2 },
        { key: 'B', label: '闷在灰里的炭', score: 1 },
        { key: 'C', label: '你不太容易生气，觉得没必要争', score: 0 }
      ]
    },
    // 维度 2：不确定外走
    {
      dim: 2,
      text: '想到未来几个月，你更常感到：',
      options: [
        { key: 'A', label: '兴奋里有点没底', score: 2 },
        { key: 'B', label: '走一步看一步', score: 1 },
        { key: 'C', label: '不太想未来，先过好现在', score: 0 }
      ]
    },
    {
      dim: 2,
      text: '你最近一次离开熟悉的地方或圈子，是因为：',
      options: [
        { key: 'A', label: '想出去看看，虽然不知道会怎样', score: 2 },
        { key: 'B', label: '不得不走，心里没底', score: 1 },
        { key: 'C', label: '还没想过离开', score: 0 }
      ]
    },
    // 维度 3：格格不入
    {
      dim: 3,
      text: '在人群里，你更常觉得：',
      options: [
        { key: 'A', label: '自己跟周围不太一样，但不打算改', score: 2 },
        { key: 'B', label: '有时格格不入，但会试着融入', score: 1 },
        { key: 'C', label: '大部分时候挺自在的', score: 0 }
      ]
    },
    {
      dim: 3,
      text: '当你喜欢的东西和别人不一样时，你：',
      options: [
        { key: 'A', label: '自己坚持，不解释', score: 2 },
        { key: 'B', label: '看情况，有时会藏起来', score: 1 },
        { key: 'C', label: '会跟着大家，不想显得特别', score: 0 }
      ]
    },
    // 维度 4：告别失去
    {
      dim: 4,
      text: '你最近一次和重要的人分开，更接近：',
      options: [
        { key: 'A', label: '没好好说再见，一直搁着', score: 2 },
        { key: 'B', label: '说了再见，但还会反复想', score: 1 },
        { key: 'C', label: '分开了就往前走了', score: 0 }
      ]
    },
    {
      dim: 4,
      text: '你手机里有没有一个不会再联系但没删的对话框？',
      options: [
        { key: 'A', label: '有，偶尔会翻到', score: 2 },
        { key: 'B', label: '有，但已经不在意了', score: 1 },
        { key: 'C', label: '没有，删得很干净', score: 0 }
      ]
    },
    // 维度 5：等待时机
    {
      dim: 5,
      text: '你现在更接近哪种状态？',
      options: [
        { key: 'A', label: '在等一个合适的时机再行动', score: 2 },
        { key: 'B', label: '在准备，但不确定什么时候算准备好', score: 1 },
        { key: 'C', label: '想到就去做，不太等', score: 0 }
      ]
    },
    {
      dim: 5,
      text: '面对一个你想要但还没得到的东西，你：',
      options: [
        { key: 'A', label: '愿意等，觉得时机没到', score: 2 },
        { key: 'B', label: '会试探着往前挪', score: 1 },
        { key: 'C', label: '等不了，要么现在要，要么不要', score: 0 }
      ]
    }
  ];

  // 6 个维度名称（顺序即平票时的取序）
  const dimensions = [
    '隐忍蓄力',
    '愤怒未发',
    '不确定外走',
    '格格不入',
    '告别失去',
    '等待时机'
  ];

  // 18 个结果，按“维度顺序 × 挡位（高/中/低）”平铺存储，下标 = 维度 × 3 + 挡位。
  const results = [
    { // 隐忍蓄力 · 高
      title: '少年嬴政 · 邯郸为质 · 屈辱下的沉默蓄力',
      experience: `十三岁在邯郸，街上有人故意让我听见那些话。我没回头，也没加快脚步。回到住处，手是攥着的，脸上什么都没有。`,
      comfort: `你咽下去那句话的时候，大概也是这个姿势吧。咽了就咽了，不代表你怂，只是你知道现在说出来，接不住的人比能接住的人多。先这样，不丢人。`
    },
    { // 隐忍蓄力 · 中
      title: '少年韩信 · 胯下之辱 · 愤怒被更大的目标压住',
      experience: `那个人叉开腿站在市集中间，让我从他胯下过去。周围有人停下来看。我低头爬了。站起来的时候，我拍了拍衣服，没看他们。`,
      comfort: `你心里那团火没烧完，不是熄了，是你自己按住的。按着它挺累的，我知道。但你没有必要现在烧给谁看，你还有别的地方要去。`
    },
    { // 隐忍蓄力 · 低
      title: '少年刘秀 · 兄长遇害后的沉默',
      experience: `我哥出事以后，我照常吃饭，照常见人。有人来试探我，我就点头，说些不痛不痒的话。夜里一个人坐着的时候，才觉得屋子太安静。`,
      comfort: `你也有先把日子过下去、把难过往后放的时候吧。那不是冷血，是你当时只能这样。等你能哭的时候再哭，没人催你。`
    },
    { // 愤怒未发 · 高
      title: '少年项羽 · 见始皇出游 · 那句话被叔父捂了回去',
      experience: `秦始皇的车队过去，人群里很挤。我说了一句"彼可取而代也"。话没落音，叔父的手就捂上来了，把我往后拽。我挣了一下，没再说话。`,
      comfort: `你心里那句话可能也没说完。被捂住的时候很难受，但不代表你说错了。有些话就是要等一个能说完的地方，你先不用怪自己当时没喊出来。`
    },
    { // 愤怒未发 · 中
      title: '少年张良 · 博浪沙之后 · 锤子砸偏了，他开始等',
      experience: `锤子砸下去，车没中。我转身就跑，跑的时候听见后面乱起来。后来我改了名字，躲了很久。再后来，我不急了。`,
      comfort: `你也有使了很大劲、结果砸偏的时候吧。砸偏不等于你不行，只是那一下不是对的地方。先躲一躲，等下一次，不丢人。`
    },
    { // 愤怒未发 · 低
      title: '少年荆轲 · 与人论剑不争 · 别人骂他，他转身走了',
      experience: `有人跟我论剑，说着说着开始骂。我看了他一会儿，没拔剑，转身走了。他在后面还在说，我没回头。`,
      comfort: `你也有不想争的时候吧。别人可能觉得你退了，但你自己知道，只是不想把力气花在这。不争就不争了，不用跟谁解释。`
    },
    { // 不确定外走 · 高
      title: '少年苏轼 · 首次出川 · 兴奋里藏着不确定',
      experience: `二十岁，船出了眉山，越走越远。白天看两岸的山，晚上停在江边，听见水声。我高兴，但躺下的时候，也会想前面到底是什么。`,
      comfort: `往外走的人，高兴里都会掺一点没底。不是你想多了，是你脚下的地方还没踩实。先走一段，踩实了就不慌了。`
    },
    { // 不确定外走 · 中
      title: '少年李白 · 初出蜀地 · 带着剑和钱，不知道前面是什么',
      experience: `我带着剑，也带着一些钱，出了蜀地。在江陵上岸的时候，钱袋还沉，前面的人我一个也不认识。我不知道钱花完了会怎样，但我不想回头。`,
      comfort: `你也有带着一点东西就上路的时候吧。心里没底，不代表你走错了，只是你还没走到能看清的地方。先走，路会慢慢显出来。`
    },
    { // 不确定外走 · 低
      title: '少年杜甫 · 漫游齐赵之间 · 还没想好要去哪',
      experience: `我在齐赵之间漫游，骑马看山，天黑就找地方住。有人问我要去哪，我说还没想好。第二天醒来，还是接着走。`,
      comfort: `还没想好要去哪的时候，看也是一种走法。别人赶路是别人的事，你不用因为别人快，就随便给自己定一个方向。`
    },
    { // 格格不入 · 高
      title: '少年嵇康 · 不随流俗 · 不打算跟别人一样',
      experience: `洛阳城外，我在树下打铁。有人过来跟我说话，说现在大家都这样那样，你怎么不。我继续打我的铁，没接他的话。`,
      comfort: `跟周围不一样，不一定是你有问题。可能只是你不想把自己塞进一个不合身的形状里。先不用急着改，不合身就是不合身。`
    },
    { // 格格不入 · 中
      title: '少年李清照 · 初入汴京 · 写的东西和周围人不太一样',
      experience: `刚到汴京，我写了几首词，拿给周围的人看。他们客客气气地说好，又说了些别的。我把稿子收起来，没再拿出来。`,
      comfort: `自己喜欢的东西，不用因为别人多看了你一眼就丢掉。收起来可以，但别扔。哪天遇到看得懂的人，再拿出来也不迟。`
    },
    { // 格格不入 · 低
      title: '少年贾谊 · 才高遭忌 · 太早被看见，还不知道怎么收',
      experience: `二十出头，我被召到朝廷，话说得很直。有人点头，有人皱眉。我那时候没看出来，后来才知道，有些话不是说得对就够了。`,
      comfort: `太早被看见，不是你的错。你只是还没学会怎么把自己收一点。以后会学会的，现在不用责怪那个太早发光的自己。`
    },
    { // 告别失去 · 高
      title: '少年纳兰 · 丧妻之后 · 写了很多词，但人回不来',
      experience: `她走了以后，我写了很多词。灯下写完，纸上都是字，屋子里还是只有我。我知道写再多她也不会回来，但我还是写。`,
      comfort: `怎么写都留不住一个人的时候，写本身也不是没用。留着就留着，想翻就翻。等它自己慢慢变轻，不用急着把谁从心里删掉。`
    },
    { // 告别失去 · 中
      title: '少年曹植 · 与友离散 · 酒还在，人散了',
      experience: `以前我们一起喝酒，杯子碰得很响。后来人一个个走了。酒还在，杯子还在，位置空着。我有时候倒酒，倒到一半才想起来。`,
      comfort: `东西还在，人已经不在了，想起来会难受。但想起来也说明那些日子真的有过。你不用假装自己已经不在意。`
    },
    { // 告别失去 · 低
      title: '少年陆游 · 沈园旧事之前 · 还没写下那首词',
      experience: `那时候春天，沈园的花开着，她还在。我们说话，她笑了一下。我不知道后来会那么久都忘不掉，也不知道那天之后会变成那样。`,
      comfort: `还在一起、却已经开始担心失去的时候，不用提前难过。先把眼前这个人、这段日子过好。以后的事，以后再说。`
    },
    { // 等待时机 · 高
      title: '少年诸葛亮 · 隆中躬耕 · 在地里等一个能接住他的人',
      experience: `我在隆中种地，读书，偶尔和朋友说说话。他们走了，我接着锄地。有人劝我出去，我没动。我在等一个能接住我的人，等不到，也可以继续种。`,
      comfort: `等不是什么都不做。你只是不想把自己交给一个不对的地方。先等一等也可以，地里的活又不会跑。`
    },
    { // 等待时机 · 中
      title: '少年谢安 · 东山不出 · 别人请他做官，他还在看',
      experience: `有人来东山请我做官。我没有马上答应，带他们看山，看水。他们着急，我不急。我不是不想做事，我只是还在看。`,
      comfort: `别人催你往前，你却还想再看一看，这不算拖延。你只是不想因为别人着急，就随便把自己交出去。再看一会儿也可以。`
    },
    { // 等待时机 · 低
      title: '少年王猛 · 卖畚箕于市 · 在市集上等一个识货的',
      experience: `我在市集上卖畚箕。人来人往，很少有人停下来。我不吆喝，也不急。我知道自己不是只能卖畚箕，只是还没遇到那个识货的人。`,
      comfort: `被放在一个不对的位置上，不代表你只有这点东西。没被看见的时候，先把手里的事做好。等那个停下来的人，他会停的。`
    }
  ];

  // 状态管理：用一个对象保存 12 道题的答案，支持返回修改后重新计算
  const answers = {};
  let currentQuestion = 0; // 当前题目索引（0~11）

  // 获取 DOM 元素
  const screenStart = document.getElementById('screen-start');
  const screenQuiz = document.getElementById('screen-quiz');
  const screenResult = document.getElementById('screen-result');
  const questionTextEl = document.getElementById('question-text');
  const optionsEl = document.getElementById('options');
  const progressEl = document.getElementById('progress');
  const backBtn = document.getElementById('btn-back');
  const resultActionEl = document.getElementById('result-action');
  const resultTitleEl = document.getElementById('result-title');
  const resultExperienceEl = document.getElementById('result-experience');
  const resultComfortEl = document.getElementById('result-comfort');

  // 切换屏幕
  function showScreen(screen) {
    screenStart.classList.toggle('active', screen === 'start');
    screenQuiz.classList.toggle('active', screen === 'quiz');
    screenResult.classList.toggle('active', screen === 'result');
  }

  // 渲染当前题目
  function renderQuestion() {
    const question = questions[currentQuestion];
    questionTextEl.textContent = question.text;
    progressEl.textContent = (currentQuestion + 1) + ' / ' + questions.length;

    // 渲染选项
    optionsEl.innerHTML = '';
    question.options.forEach(function (option) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'option';
      button.dataset.key = option.key;

      const mark = document.createElement('span');
      mark.className = 'mark';
      mark.textContent = option.key;

      const label = document.createElement('span');
      label.textContent = option.label;

      button.appendChild(mark);
      button.appendChild(label);

      // 若该题已有答案，恢复高亮
      if (answers[currentQuestion + 1] === option.key) {
        button.classList.add('selected');
      }

      button.addEventListener('click', function () {
        selectOption(option.key);
      });

      optionsEl.appendChild(button);
    });

    // 返回按钮：第一题时禁用
    backBtn.disabled = currentQuestion === 0;

    // 最后一题选完后显示“查看结果”按钮，其余情况隐藏
    const isLast = currentQuestion === questions.length - 1;
    const showResultBtn = isLast && answers[questions.length] !== undefined && answers[questions.length] !== null;
    resultActionEl.hidden = !showResultBtn;
  }

  // 选择某个选项
  function selectOption(key) {
    answers[currentQuestion + 1] = key;

    // 高亮当前选项
    const allOptions = optionsEl.querySelectorAll('.option');
    allOptions.forEach(function (btn) {
      btn.classList.toggle('selected', btn.dataset.key === key);
    });

    // 最后一题选完：显示“查看结果”，不自动跳转
    if (currentQuestion === questions.length - 1) {
      resultActionEl.hidden = false;
      return;
    }

    // 其余题目选完：自动进入下一题（稍作延迟以展示选中反馈）
    setTimeout(function () {
      currentQuestion += 1;
      renderQuestion();
    }, 250);
  }

  // 返回上一题修改
  function goBack() {
    if (currentQuestion === 0) return;
    currentQuestion -= 1;
    renderQuestion();
  }

  // 计分并映射结果（在点击“查看结果”时执行，不在选择时提前泄露）
  function computeResult() {
    // 计算 6 个维度总分（每个维度 2 题，满分 4 分）
    const scores = [0, 0, 0, 0, 0, 0];
    questions.forEach(function (question, index) {
      const choice = answers[index + 1];
      if (!choice) return;
      const option = question.options.find(function (o) { return o.key === choice; });
      scores[question.dim] += option.score;
    });

    // 取最高分维度；平票时按维度顺序取靠前者（数组从左到右首次最大）
    let bestDim = 0;
    let bestScore = scores[0];
    for (let d = 1; d < dimensions.length; d++) {
      if (scores[d] > bestScore) {
        bestScore = scores[d];
        bestDim = d;
      }
    }

    // 4 或 3 → 高挡；2 → 中挡；0 或 1 → 低挡
    let tier;
    if (bestScore >= 3) {
      tier = 'high';
    } else if (bestScore === 2) {
      tier = 'mid';
    } else {
      tier = 'low';
    }

    // 挡位转下标：high=0、mid=1、low=2；结果按 维度×3 + 挡位 平铺存储
    const tierIndex = { high: 0, mid: 1, low: 2 };
    return results[bestDim * 3 + tierIndex[tier]];
  }

  // 展示结果页
  function showResult() {
    const result = computeResult();
    resultTitleEl.textContent = result.title;
    resultExperienceEl.textContent = result.experience;
    resultComfortEl.textContent = result.comfort;
    showScreen('result');
  }

  // 再测一次：重置状态回到首屏
  function resetTest() {
    for (const key in answers) {
      delete answers[key];
    }
    currentQuestion = 0;
    showScreen('start');
  }

  // 绑定事件
  document.getElementById('btn-start').addEventListener('click', function () {
    showScreen('quiz');
    renderQuestion();
  });

  backBtn.addEventListener('click', goBack);

  document.getElementById('btn-result').addEventListener('click', showResult);

  document.getElementById('btn-retry').addEventListener('click', resetTest);
</script>
</body>
</html>
