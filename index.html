<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>你此刻像哪个少年古人</title>
<style>
  /* 基础重置与全局样式 */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    font-size: 16px; /* 基础字号 16px */
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f6f4ef; /* 浅色纯色背景 */
    color: #2b2b2b; /* 深色文字 */
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }

  /* 移动端优先：内容容器最大宽度 640px 居中 */
  .app {
    width: 100%;
    max-width: 640px;
    min-height: 100vh;
    padding: 24px 20px 32px;
    display: flex;
    flex-direction: column;
  }

  /* 屏幕切换控制 */
  .screen {
    display: none;
    flex: 1;
    flex-direction: column;
  }
  .screen.active {
    display: flex;
  }

  /* 首屏 */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 24px 0;
  }
  .hero h1 {
    font-size: 2rem;
    line-height: 1.3;
    letter-spacing: 0.02em;
    margin-bottom: 12px;
  }
  .hero .subtitle {
    font-size: 1rem;
    color: #6b6b6b;
    margin-bottom: 32px;
  }
  .pay-hint {
    /* 首屏必须清晰可见的付费提示，不藏在按钮后 */
    font-size: 0.875rem;
    color: #8a6d3b;
    background: #fbf5e6;
    border: 1px solid #e8dcc0;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 32px;
    line-height: 1.6;
  }

  /* 按钮通用 */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px; /* 触控区域不小于 44px */
    padding: 12px 28px;
    font-size: 1rem;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  .btn:active {
    transform: scale(0.98);
  }
  .btn-primary {
    background: #3a3a3a;
    color: #ffffff;
    width: 100%;
    max-width: 320px;
  }
  .btn-ghost {
    background: transparent;
    color: #6b6b6b;
    border: 1px solid #d8d3c8;
    width: 100%;
    max-width: 320px;
  }

  /* 题目区域 */
  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    min-height: 44px;
  }
  .back-btn {
    min-height: 44px;
    min-width: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: #6b6b6b;
    font-size: 0.9375rem;
    cursor: pointer;
    border-radius: 8px;
  }
  .back-btn:disabled {
    opacity: 0;
    pointer-events: none;
  }
  .progress {
    font-size: 0.8125rem;
    color: #9a9a9a;
    letter-spacing: 0.05em;
  }

  .question-text {
    font-size: 1.375rem;
    line-height: 1.5;
    font-weight: 600;
    margin-bottom: 28px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 28px;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    min-height: 56px; /* 触控区域不小于 44px */
    padding: 14px 16px;
    font-size: 1rem;
    line-height: 1.5;
    background: #ffffff;
    color: #2b2b2b;
    border: 1.5px solid #e2ddd1;
    border-radius: 12px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option .mark {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.875rem;
    font-weight: 600;
    background: #f0ede6;
    border-radius: 50%;
    color: #6b6b6b;
  }
  .option.selected {
    border-color: #3a3a3a;
    background: #f3f1ea;
  }
  .option.selected .mark {
    background: #3a3a3a;
    color: #ffffff;
  }

  .result-action {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 结果页 */
  .result {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 16px 0;
  }
  .result-badge {
    font-size: 0.8125rem;
    letter-spacing: 0.2em;
    color: #8a6d3b;
    margin-bottom: 18px;
  }
  .result-title {
    font-size: 1.5rem;
    line-height: 1.5;
    font-weight: 700;
    margin-bottom: 24px;
  }
  .result-desc {
    font-size: 1rem;
    line-height: 1.9;
    color: #3c3c3c;
    margin-bottom: 20px;
  }
  .result-closer {
    font-size: 0.875rem; /* 稍小字号 */
    color: #6b6b6b;
    margin-bottom: 40px;
  }
  .result-bottom {
    margin-top: auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .disclaimer {
    font-size: 0.6875rem; /* 最小字号 */
    color: #a5a5a5;
    line-height: 1.5;
    max-width: 320px;
  }
</style>
</head>
<body>
<div class="app">

  <!-- 首屏 -->
  <section id="screen-start" class="screen active">
    <div class="hero">
      <h1>你此刻像哪个少年古人</h1>
      <p class="subtitle">12 道题，约 1 分钟</p>
      <!-- 付费提示：首屏清晰可见，不藏在按钮后 -->
      <p class="pay-hint">本测试结果需支付 0.99 元解锁。付款后自动获得测试链接。</p>
      <button id="btn-start" class="btn btn-primary" type="button">开始测试</button>
    </div>
  </section>

  <!-- 答题屏 -->
  <section id="screen-quiz" class="screen">
    <div class="quiz-header">
      <button id="btn-back" class="back-btn" type="button" aria-label="返回上一题">← 上一题</button>
      <span id="progress" class="progress">1 / 12</span>
    </div>
    <h2 id="question-text" class="question-text"></h2>
    <div id="options" class="options"></div>
    <div id="result-action" class="result-action" hidden>
      <button id="btn-result" class="btn btn-primary" type="button">查看结果</button>
    </div>
  </section>

  <!-- 结果屏 -->
  <section id="screen-result" class="screen">
    <div class="result">
      <div class="result-badge">人物 · 时刻 · 情绪坐标</div>
      <h2 id="result-title" class="result-title"></h2>
      <p id="result-desc" class="result-desc"></p>
      <p class="result-closer">你最近咽下去的那句话是什么？</p>
      <div class="result-bottom">
        <button id="btn-retry" class="btn btn-ghost" type="button">再测一次</button>
        <p class="disclaimer">本测试为情绪趣味探索，不构成心理诊断或医疗建议。</p>
      </div>
    </div>
  </section>

</div>

<script>
  // 12 道题，每题三个选项，A=2 分、B=1 分、C=0 分。
  // dim 字段表示该题所属维度（0~5），与 results 数组下标对应。
  const questions = [
    // 维度 0：隐忍蓄力
    {
      dim: 0,
      text: '最近一次你咽下一句话没说出来，是因为什么？',
      options: [
        { key: 'A', label: '怕说出来后果更糟', score: 2 },
        { key: 'B', label: '觉得说了也没用', score: 1 },
        { key: 'C', label: '你一般不会咽，当场就说了', score: 0 }
      ]
    },
    {
      dim: 0,
      text: '当你被人故意忽视时，你更可能：',
      options: [
        { key: 'A', label: '不抬头，把情绪收起来', score: 2 },
        { key: 'B', label: '表面没事，心里记着', score: 1 },
        { key: 'C', label: '直接问对方什么意思', score: 0 }
      ]
    },
    // 维度 1：愤怒未发
    {
      dim: 1,
      text: '你心里那团火最近一次烧起来，是因为什么？',
      options: [
        { key: 'A', label: '被人当众否定，但你忍住了', score: 2 },
        { key: 'B', label: '一件小事反复被踩，你还没发作', score: 1 },
        { key: 'C', label: '你很少压火，一般当场就发', score: 0 }
      ]
    },
    {
      dim: 1,
      text: '如果愤怒有形状，你此刻的更像：',
      options: [
        { key: 'A', label: '烧到一半被你按住的火', score: 2 },
        { key: 'B', label: '闷在灰里的炭', score: 1 },
        { key: 'C', label: '你不太容易生气，觉得没必要争', score: 0 }
      ]
    },
    // 维度 2：不确定外走
    {
      dim: 2,
      text: '想到未来几个月，你更常感到：',
      options: [
        { key: 'A', label: '兴奋里有点没底', score: 2 },
        { key: 'B', label: '走一步看一步', score: 1 },
        { key: 'C', label: '不太想未来，先过好现在', score: 0 }
      ]
    },
    {
      dim: 2,
      text: '你最近一次离开熟悉的地方或圈子，是因为：',
      options: [
        { key: 'A', label: '想出去看看，虽然不知道会怎样', score: 2 },
        { key: 'B', label: '不得不走，心里没底', score: 1 },
        { key: 'C', label: '还没想过离开', score: 0 }
      ]
    },
    // 维度 3：格格不入
    {
      dim: 3,
      text: '在人群里，你更常觉得：',
      options: [
        { key: 'A', label: '自己跟周围不太一样，但不打算改', score: 2 },
        { key: 'B', label: '有时格格不入，但会试着融入', score: 1 },
        { key: 'C', label: '大部分时候挺自在的', score: 0 }
      ]
    },
    {
      dim: 3,
      text: '当你喜欢的东西和别人不一样时，你：',
      options: [
        { key: 'A', label: '自己坚持，不解释', score: 2 },
        { key: 'B', label: '看情况，有时会藏起来', score: 1 },
        { key: 'C', label: '会跟着大家，不想显得特别', score: 0 }
      ]
    },
    // 维度 4：告别失去
    {
      dim: 4,
      text: '你最近一次和重要的人分开，更接近：',
      options: [
        { key: 'A', label: '没好好说再见，一直搁着', score: 2 },
        { key: 'B', label: '说了再见，但还会反复想', score: 1 },
        { key: 'C', label: '分开了就往前走了', score: 0 }
      ]
    },
    {
      dim: 4,
      text: '你手机里有没有一个不会再联系但没删的对话框？',
      options: [
        { key: 'A', label: '有，偶尔会翻到', score: 2 },
        { key: 'B', label: '有，但已经不在意了', score: 1 },
        { key: 'C', label: '没有，删得很干净', score: 0 }
      ]
    },
    // 维度 5：等待时机
    {
      dim: 5,
      text: '你现在更接近哪种状态？',
      options: [
        { key: 'A', label: '在等一个合适的时机再行动', score: 2 },
        { key: 'B', label: '在准备，但不确定什么时候算准备好', score: 1 },
        { key: 'C', label: '想到就去做，不太等', score: 0 }
      ]
    },
    {
      dim: 5,
      text: '面对一个你想要但还没得到的东西，你：',
      options: [
        { key: 'A', label: '愿意等，觉得时机没到', score: 2 },
        { key: 'B', label: '会试探着往前挪', score: 1 },
        { key: 'C', label: '等不了，要么现在要，要么不要', score: 0 }
      ]
    }
  ];

  // 6 个维度名称（顺序即平票时的取序）
  const dimensions = [
    '隐忍蓄力',
    '愤怒未发',
    '不确定外走',
    '格格不入',
    '告别失去',
    '等待时机'
  ];

  // 18 个结果：results[维度][挡位]，挡位 high=高 / mid=中 / low=低
  const results = [
    { // 隐忍蓄力
      high: { title: '少年嬴政 · 邯郸为质 · 屈辱下的沉默蓄力', desc: '他学会了不抬头。' },
      mid:  { title: '少年韩信 · 胯下之辱 · 愤怒被更大的目标压住', desc: '他从人胯下爬过去，没说话。' },
      low:  { title: '少年刘秀 · 兄长遇害后的沉默', desc: '他哭完，把事压在心里。' }
    },
    { // 愤怒未发
      high: { title: '少年项羽 · 见始皇出游 · 那句话被叔父捂了回去', desc: '他被叔父捂住嘴，那句话咽了回去。' },
      mid:  { title: '少年张良 · 博浪沙之后 · 锤子砸偏了，他开始等', desc: '锤子砸偏了，他开始等。' },
      low:  { title: '少年荆轲 · 与人论剑不争 · 别人骂他，他转身走了', desc: '别人骂他，他转身走了。' }
    },
    { // 不确定外走
      high: { title: '少年苏轼 · 首次出川 · 兴奋里藏着不确定', desc: '船越走越远，他高兴，也有点没底。' },
      mid:  { title: '少年李白 · 初出蜀地 · 带着剑和钱，不知道前面是什么', desc: '他带着剑和钱，不知道前面是什么。' },
      low:  { title: '少年杜甫 · 漫游齐赵之间 · 还没想好要去哪', desc: '他还没想好要去哪。' }
    },
    { // 格格不入
      high: { title: '少年嵇康 · 不随流俗 · 不打算跟别人一样', desc: '他不打算跟别人一样。' },
      mid:  { title: '少年李清照 · 初入汴京 · 写的东西和周围人不太一样', desc: '她写的东西，和周围人不太一样。' },
      low:  { title: '少年贾谊 · 才高遭忌 · 太早被看见，还不知道怎么收', desc: '他太早被看见，还不知道怎么收。' }
    },
    { // 告别失去
      high: { title: '少年纳兰 · 丧妻之后 · 写了很多词，但人回不来', desc: '他写了很多词，但人回不来。' },
      mid:  { title: '少年曹植 · 与友离散 · 酒还在，人散了', desc: '酒还在，人散了。' },
      low:  { title: '少年陆游 · 沈园旧事之前 · 还没写下那首词', desc: '他还没写下那首词。' }
    },
    { // 等待时机
      high: { title: '少年诸葛亮 · 隆中躬耕 · 在地里等一个能接住他的人', desc: '他在地里等，等一个能接住他的人。' },
      mid:  { title: '少年谢安 · 东山不出 · 别人请他做官，他还在看', desc: '别人请他做官，他还在看。' },
      low:  { title: '少年王猛 · 卖畚箕于市 · 在市集上等一个识货的', desc: '他在市集上卖畚箕，等一个识货的。' }
    }
  ];

  // 状态管理：用一个对象保存 12 道题的答案，支持返回修改后重新计算
  const answers = {};
  let currentQuestion = 0; // 当前题目索引（0~11）

  // 获取 DOM 元素
  const screenStart = document.getElementById('screen-start');
  const screenQuiz = document.getElementById('screen-quiz');
  const screenResult = document.getElementById('screen-result');
  const questionTextEl = document.getElementById('question-text');
  const optionsEl = document.getElementById('options');
  const progressEl = document.getElementById('progress');
  const backBtn = document.getElementById('btn-back');
  const resultActionEl = document.getElementById('result-action');
  const resultTitleEl = document.getElementById('result-title');
  const resultDescEl = document.getElementById('result-desc');

  // 切换屏幕
  function showScreen(screen) {
    screenStart.classList.toggle('active', screen === 'start');
    screenQuiz.classList.toggle('active', screen === 'quiz');
    screenResult.classList.toggle('active', screen === 'result');
  }

  // 渲染当前题目
  function renderQuestion() {
    const question = questions[currentQuestion];
    questionTextEl.textContent = question.text;
    progressEl.textContent = (currentQuestion + 1) + ' / ' + questions.length;

    // 渲染选项
    optionsEl.innerHTML = '';
    question.options.forEach(function (option) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'option';
      button.dataset.key = option.key;

      const mark = document.createElement('span');
      mark.className = 'mark';
      mark.textContent = option.key;

      const label = document.createElement('span');
      label.textContent = option.label;

      button.appendChild(mark);
      button.appendChild(label);

      // 若该题已有答案，恢复高亮
      if (answers[currentQuestion + 1] === option.key) {
        button.classList.add('selected');
      }

      button.addEventListener('click', function () {
        selectOption(option.key);
      });

      optionsEl.appendChild(button);
    });

    // 返回按钮：第一题时禁用
    backBtn.disabled = currentQuestion === 0;

    // 最后一题选完后显示“查看结果”按钮，其余情况隐藏
    const isLast = currentQuestion === questions.length - 1;
    const showResultBtn = isLast && answers[questions.length] !== undefined && answers[questions.length] !== null;
    resultActionEl.hidden = !showResultBtn;
  }

  // 选择某个选项
  function selectOption(key) {
    answers[currentQuestion + 1] = key;

    // 高亮当前选项
    const allOptions = optionsEl.querySelectorAll('.option');
    allOptions.forEach(function (btn) {
      btn.classList.toggle('selected', btn.dataset.key === key);
    });

    // 最后一题选完：显示“查看结果”，不自动跳转
    if (currentQuestion === questions.length - 1) {
      resultActionEl.hidden = false;
      return;
    }

    // 其余题目选完：自动进入下一题（稍作延迟以展示选中反馈）
    setTimeout(function () {
      currentQuestion += 1;
      renderQuestion();
    }, 250);
  }

  // 返回上一题修改
  function goBack() {
    if (currentQuestion === 0) return;
    currentQuestion -= 1;
    renderQuestion();
  }

  // 计分并映射结果（在点击“查看结果”时执行，不在选择时提前泄露）
  function computeResult() {
    // 计算 6 个维度总分（每个维度 2 题，满分 4 分）
    const scores = [0, 0, 0, 0, 0, 0];
    questions.forEach(function (question, index) {
      const choice = answers[index + 1];
      if (!choice) return;
      const option = question.options.find(function (o) { return o.key === choice; });
      scores[question.dim] += option.score;
    });

    // 取最高分维度；平票时按维度顺序取靠前者（数组从左到右首次最大）
    let bestDim = 0;
    let bestScore = scores[0];
    for (let d = 1; d < dimensions.length; d++) {
      if (scores[d] > bestScore) {
        bestScore = scores[d];
        bestDim = d;
      }
    }

    // 4 或 3 → 高挡；2 → 中挡；0 或 1 → 低挡
    let tier;
    if (bestScore >= 3) {
      tier = 'high';
    } else if (bestScore === 2) {
      tier = 'mid';
    } else {
      tier = 'low';
    }

    return results[bestDim][tier];
  }

  // 展示结果页
  function showResult() {
    const result = computeResult();
    resultTitleEl.textContent = result.title;
    resultDescEl.textContent = result.desc;
    showScreen('result');
  }

  // 再测一次：重置状态回到首屏
  function resetTest() {
    for (const key in answers) {
      delete answers[key];
    }
    currentQuestion = 0;
    showScreen('start');
  }

  // 绑定事件
  document.getElementById('btn-start').addEventListener('click', function () {
    showScreen('quiz');
    renderQuestion();
  });

  backBtn.addEventListener('click', goBack);

  document.getElementById('btn-result').addEventListener('click', showResult);

  document.getElementById('btn-retry').addEventListener('click', resetTest);
</script>
</body>
</html>
